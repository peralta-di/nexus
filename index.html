<style>
/* Concepto: una columna con forma de teléfono sobre un fondo suave; tarjetas pastel por materia, barra flotante abajo con cuatro íconos. */
:root{--stage:#e7e2f2;--bg:#ffffff;--bg2:#eef3ff;--ink:#101014;--fg:#101014;--mute:#7a7e8f;--line:#e8eaf2;--surf:#f4f5fa;--surf2:#e9ebf4;--card:#ffffff;--inv:#0b0b10;--invfg:#ffffff;
 --t-blue:#eaf0ff;--t-mint:#e2faf3;--t-cream:#fff4d8;--t-lilac:#f6e9ff;--t-rose:#ffe8ee;
 --g-blue:linear-gradient(135deg,#6cc4ff,#3b7cf0);--g-mint:linear-gradient(135deg,#5fe3c8,#25b79d);--g-amber:linear-gradient(135deg,#ffd16a,#ff9a45);--g-lilac:linear-gradient(135deg,#cfb8ff,#9c82f7);--g-pink:linear-gradient(135deg,#ff9fd2,#f26cb0);
 --shadow:0 10px 30px rgba(52,52,110,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#05050a;--bg:#0d0d15;--bg2:#141428;--ink:#f4f4f8;--fg:#f4f4f8;--mute:#9b9eb2;--line:#26263a;--surf:#171724;--surf2:#202034;--card:#1a1a29;--inv:#ffffff;--invfg:#0b0b10;--t-blue:#18213f;--t-mint:#0f3631;--t-cream:#37300f;--t-lilac:#2c1a3d;--t-rose:#3a1a26;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--stage:#05050a;--bg:#0d0d15;--bg2:#141428;--ink:#f4f4f8;--fg:#f4f4f8;--mute:#9b9eb2;--line:#26263a;--surf:#171724;--surf2:#202034;--card:#1a1a29;--inv:#ffffff;--invfg:#0b0b10;--t-blue:#18213f;--t-mint:#0f3631;--t-cream:#37300f;--t-lilac:#2c1a3d;--t-rose:#3a1a26;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink);font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

@media (min-width:600px){.stage{padding:24px 0}.phone{min-height:calc(100vh - 48px);border-radius:38px;box-shadow:var(--shadow)}}

.sec>div:not(.fl)>*+*{margin-top:18px}

.hero>*{position:relative;z-index:1}
.banner{background:var(--g-pink);color:#fff;border-radius:28px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.trow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--tint,var(--surf));width:100%;text-align:left;border:0;border-radius:20px;color:var(--ink)}
.trow:hover{filter:brightness(.97)}
.bar{height:8px;background:var(--surf2);border-radius:999px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--g-lilac);border-radius:999px;transition:width .3s}
.timer{font-size:clamp(60px,18vw,92px);font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}

.tab[aria-selected=true]{background:var(--inv);color:var(--invfg)}
.drop{border:2px dashed var(--line);border-radius:24px;padding:28px 16px;text-align:center;background:var(--surf)}

.dc{border:0;background:var(--surf);border-radius:20px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;color:var(--ink)}

.tl time{font-size:12px;color:var(--mute);padding-top:12px;font-weight:500}
.gcard{background:var(--grad,var(--g-blue));color:#fff;border-radius:24px;padding:14px 16px;text-align:left;border:0;width:100%;display:block}

.ccard{background:var(--tint,var(--surf));border-radius:24px;padding:14px 16px;width:100%}

.opt.ok{background:var(--t-mint);border-color:#25b79d}

.bub{max-width:min(100%,640px);border-radius:22px;padding:14px 16px}
.bub-t{background:var(--surf);border-bottom-left-radius:6px}
.bub-u{background:var(--inv);color:var(--invfg);margin-left:auto;border-bottom-right-radius:6px}

.step{display:flex;gap:10px;margin-top:12px}
.step b.n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--inv);color:var(--invfg);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}

.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 18px 40px}
.sheet{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.hatch{border-top:1.5px dashed var(--line)}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mute)}
.fl{display:flex;flex-direction:column}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surf);border-radius:999px;padding:7px 14px 7px 10px;font-weight:500;font-size:13.5px;align-self:flex-start}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin:0 2px;animation:bl 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---- ingreso ---- */
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:grid;grid-template-columns:1fr}
.gate-art{display:none;background:var(--g-lilac);padding:64px 56px;flex-direction:column;justify-content:center}
.gate-art .logo{width:64px;height:64px;border-radius:22px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff}
.brand .logo{color:#fff;font-weight:700}
.gate-form{display:flex;justify-content:center;align-items:flex-start;padding:max(28px,env(safe-area-inset-top,0px)) 18px 40px}
.gate-box{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px;margin:auto 0}
@media (min-width:900px){.gate{grid-template-columns:1.05fr 1fr}.gate-art{display:flex}.gate-form{align-items:center;padding:40px}}
/* ---- versión web (escritorio) ---- */
.brand,.me,.dk-wide{display:none}
@media (min-width:600px){.stage{padding:0}.phone{max-width:none;border-radius:0;box-shadow:none;min-height:100vh}.pad{max-width:780px;margin:0 auto;padding:32px 28px 150px}.sheet{max-width:560px}}
@media (min-width:960px){
 .phone{padding-left:250px}
 .pad{max-width:940px;padding:40px 48px 72px}

 .dock .pill,.dock .round{display:flex;flex-direction:column;gap:4px;background:transparent;box-shadow:none;padding:0;border-radius:0}
 .dk-wide{display:flex}
 .dk{width:100%;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 16px;font-size:14.5px;border-radius:16px}
 .dk:hover:not([aria-current=page]){background:var(--surf)}

 .me small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}

 :root{--tutor-bottom:16px}

}
:root{--tutor-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<noscript>Nexus necesita JavaScript para funcionar.</noscript>
<div id="root"></div>
<script>
/* ---------- IA propia (solo fuera de claude.ai): clave de Anthropic de la persona ---------- */
const STANDALONE=!(window.claude&&window.claude.use);
/* Vista previa en Claude: muestra suscripción y recordatorios en modo demo (pagos y emails simulados) */
const PREVIEW=false;
const SHOW_PAY=STANDALONE||PREVIEW;
const aiKey={get:()=>{try{return localStorage.getItem('ea-key')||''}catch(e){return ''}},set:k=>{try{k?localStorage.setItem('ea-key',k):localStorage.removeItem('ea-key')}catch(e){}window.dispatchEvent(new Event('ea-ai'))}};
/* Nexus dentro de Claude: el link del artifact publicado en claude.ai. Ahí la IA usa la cuenta de Claude de cada persona. */
const CLAUDE_APP_URL='https://claude.ai/artifact/WsunKkPTN3zjemT6s3RUp4';
/* Abre claude.ai con un pedido ya armado con el perfil y el material de la persona (usa su propia cuenta de Claude). */
function openInClaude(prompt,toast){
  const p=String(prompt).slice(0,6500);
  try{navigator.clipboard&&navigator.clipboard.writeText(prompt).catch(()=>{})}catch(e){}
  window.open('https://claude.ai/new?q='+encodeURIComponent(p),'_blank','noopener');
  toast&&toast(prompt.length>6500?'Abrí Claude. El pedido completo quedó copiado: si aparece cortado, pegalo.':'Abrí Claude con tu pedido listo');
}
const AI_MODELS={quick:'claude-haiku-4-5-20251001',default:'claude-sonnet-5-5',complex:'claude-opus-5-5'};
const blobB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
function makeSample(){
  const key=aiKey.get();if(!key)return null;
  const fail=(e,text)=>({code:e&&e.name==='AbortError'?'cancelled':'upstream_error',message:String(e&&e.message||e),text:text||''});
  const call=async(input,o={})=>{
    const turns=(typeof input==='string'?[{role:'user',content:input}]:input).map(t=>({role:t.role,content:t.content}));
    const imgs=o.images?(o.images instanceof Blob?[o.images]:[...o.images]):[];
    if(imgs.length){const last=turns[turns.length-1];const parts=await Promise.all(imgs.map(async b=>({type:'image',source:{type:'base64',media_type:b.type||'image/png',data:await blobB64(b)}})));last.content=[...parts,{type:'text',text:last.content}]}
    let res;
    try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:o.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:AI_MODELS[o.modelTier]||AI_MODELS.default,max_tokens:4096,stream:!!o.onText,messages:turns})})}
    catch(e){throw fail(e)}
    if(!res.ok){const s=res.status;throw {code:s===401||s===403?'not_granted':s===429?'rate_limited':s===413?'prompt_too_large':'upstream_error',message:'HTTP '+s,text:''}}
    if(!o.onText){const j=await res.json();return {text:(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(''),truncated:j.stop_reason==='max_tokens'}}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='',stop='';
    try{for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;let ev;try{ev=JSON.parse(d)}catch(e){continue}
        if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;o.onText({text,delta:ev.delta.text})}
        else if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason}}}
    catch(e){throw fail(e,text)}
    return {text,truncated:stop==='max_tokens'};
  };

const isHead=l=>{const t=l.trim();if(t.length<3||t.length>80)return false;const w=t.split(/\s+/).length;if(w>10)return false;

  if(/:$/.test(t)&&w<=8)return true;const up=t.replace(/[^A-Za-zÁÉÍÓÚÑ]/g,''),UP=up.replace(/[^A-ZÁÉÍÓÚÑ]/g,'');return up.length>=4&&UP.length/up.length>.75;};
const cleanHead=h=>h.replace(/^#{1,4}\s*/,'').replace(/^(\d+(\.\d+)*[.)-]?|[IVX]+[.)-])\s+/,'').replace(/^(tema|unidad|cap[ií]tulo|clase|m[oó]dulo|bolilla)\s*\d*\s*[:.\-–]?\s*/i,'').replace(/[:.]$/,'').trim().replace(/^./,c=>c.toUpperCase());
function splitSections(text){
  const lines=String(text||'').split('\n');let secs=[],cur=null;
  lines.forEach(l=>{if(isHead(l)&&cleanHead(l).length>=3){cur={name:cleanHead(l),body:''};secs.push(cur)}else if(cur)cur.body+=l+'\n';else{cur={name:'',body:l+'\n'};secs.push(cur)}});
  secs=secs.filter(x=>x.name&&wordsOf(x.body)>=12);
  if(secs.length>=2)return secs;
  /* sin títulos: "Tema. Desarrollo…" al comienzo de cada párrafo */
  const paras=String(text||'').split(/\n+/).map(x=>x.trim()).filter(x=>wordsOf(x)>=12);
  secs=paras.map(x=>{const m=x.match(/^([^.:]{3,70})[.:]\s+(.*)$/s);return m&&m[1].split(/\s+/).length<=7?{name:m[1].trim().replace(/^./,c=>c.toUpperCase()),body:m[2]}:null}).filter(Boolean);
  if(secs.length>=2)return secs;
  /* último recurso: partes de ~300 palabras con su palabra más repetida */
  const ws=String(text||'').split(/\s+/),out=[];
  for(let i=0;i<ws.length;i+=300){const body=ws.slice(i,i+300).join(' ');if(wordsOf(body)<40)continue;const cnt={};(body.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]{6,}/g)||[]).forEach(w=>{const k=fold(w);if(!STOPW.has(k))cnt[k]=(cnt[k]||0)+1});const top=Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0];out.push({name:'Parte '+(out.length+1)+(top?': '+top[0].replace(/^./,c=>c.toUpperCase()):''),body})}
  return out;
}

function localSyllabus(mats){
  const all=[];
  mats.filter(m=>m.kind!=='examen').forEach(m=>splitSections(m.text).forEach(x=>{const k=keyOf(x.name),prev=all.find(y=>keyOf(y.name)===k);if(prev){prev.body+='\n'+x.body}else all.push({name:x.name,body:x.body,src:m.name})}));
  const exams=mats.filter(m=>m.kind==='examen').map(m=>fold(m.text));
  let tops=all.slice().sort((x,y)=>wordsOf(y.body)-wordsOf(x.body)).slice(0,12);
  tops=all.filter(x=>tops.includes(x));
  const rank=tops.slice().sort((x,y)=>wordsOf(y.body)-wordsOf(x.body));
  return tops.map(x=>{
    const w=wordsOf(x.body),r=rank.indexOf(x)/Math.max(1,tops.length),kw=keyWords(x.name).filter(k=>k.length>=5);
    const inEx=exams.filter(e=>kw.length&&kw.every(k=>e.includes(k.slice(0,Math.max(5,k.length-2))))).length;
    const imp=/importante|clave|fundamental|siempre (lo )?toman|ojo/i.test(x.body);
    const level=inEx||(imp&&r<.8)||r<.4?'muy':r<.8?'imp':'comp';
    const sn=sentencesOf(x.body);
    return {name:x.name,pts:(sn.length?sn:[x.body.trim().slice(0,200)]).slice(0,4),tec:sn.slice(0,2).join(' '),ana:'',level,blocks:blocksFor(w),src:x.src,body:x.body.trim().slice(0,3000),inEx};
  });
}
/* Busca en el material el fragmento que habla de un tema (para leerlo durante el bloque) */
function excerptFor(mats,name){
  const kw=keyWords(name).filter(k=>k.length>=4);if(!kw.length)return null;
  for(const m of mats){const t=fold(m.text||'');let i=t.indexOf(fold(name));if(i<0){const k=kw.sort((x,y)=>y.length-x.length)[0];i=t.indexOf(k)}if(i>=0){const a=Math.max(0,t.lastIndexOf('\n',i));return {src:m.name,body:m.text.slice(a,a+2500).trim()}}}
  return null;
}

/* ---------- Motor del planificador ---------- */
function buildPlan(S){
  const {subjects,prefs,mastery,slow,kept,reviews,rescue}=S,events=S.events||[],out=[],N=21;
  const exam=s=>rescue&&rescue.exam[s.id]!=null?rescue.exam[s.id]:s.exam;
  const nowMin=Math.ceil(((S.nowMs-D0.getTime())/6e4)/5)*5;
  const work={},need={};subjects.forEach(s=>s.topics.forEach(t=>{work[t.id]=Math.max(.08,(100-(mastery[t.id]??50))/100);need[t.id]=t.blocks?Math.max(0,Math.round(t.blocks*(100-(mastery[t.id]??40))/80)):0}));
  const occ=Array.from({length:N},()=>[]);
  for(let d=0;d<N;d++)events.forEach(e=>{if(!evOnDay(e,d))return;const a=e.start,b=Math.max(e.end,e.start+15);out.push({id:`ev${e.id}-${d}`,day:d,start:a,dur:b-a,type:'event',ev:e,subj:e.subj||null});occ[d].push([a,b])});
  kept.forEach(k=>{out.push({...k,done:true});occ[k.day]&&occ[k.day].push([k.start,k.start+k.dur])});
  subjects.forEach(s=>{const e=exam(s);if(e>=0&&e<N&&!events.some(v=>v.kind==='parcial'&&v.subj===s.id&&evOnDay(v,e)))out.push({id:'e'+s.id,day:e,start:0,dur:0,type:'exam',subj:s.id})});
  const DUR=45,cap=(rescue?rescue.hours:prefs.maxH)*60,end=prefs.to*60+(rescue?60:0);
  const revs=reviews.map(r=>({...r,day:Math.max(0,Math.floor((r.due-D0.getTime())/DAY))}));
  let last=null;
  for(let d=0;d<N;d++){
    let budget=cap-kept.filter(k=>k.day===d).reduce((a,k)=>a+k.dur,0);
    if(budget<DUR)continue;
    let t=prefs.from*60;if(d===0)t=Math.max(t,nowMin);
    const free=x0=>{let x=x0,m=true;while(m){m=false;for(const [a,b] of occ[d])if(x<b&&x+DUR>a){x=b;m=true}}return x};
    const pend=revs.filter(r=>r.day===d);let n=0;
    while(budget>=DUR){
      t=free(t);if(t+DUR>end)break;
      let pick=null,rv=false;
      if(pend.length){const r=pend.shift(),f=findT(subjects,r.topic);if(f){pick=f;rv=true}}
      if(!pick){let best=-1;subjects.forEach(s=>{const e=exam(s);if(e<=d)return;if(rescue&&rescue.exam[s.id]==null)return;const days=e-d;s.topics.forEach(tp=>{if(rescue&&tp.level==='comp')return;if(s.onlyMat&&!tp.fromMat)return;const sc=(need[tp.id]>0?1.6:1)*LV[tp.level].w*(1+10/days)*(.6+s.diff/5)*(work[tp.id]+.1)*(1+(slow[tp.id]||0)*.3)*(last&&last.id===tp.id?.5:1)*(1+tp.freq/200);if(sc>best){best=sc;pick={s,t:tp}}})})}
      if(!pick)break;
      out.push({id:`s${d}-${t}`,day:d,start:t,dur:DUR,type:'study',subj:pick.s.id,topic:pick.t.id,review:rv,done:false});
      need[pick.t.id]=(need[pick.t.id]||0)-1;work[pick.t.id]*=need[pick.t.id]>0?.92:.78;last=pick.t;occ[d].push([t,t+DUR]);budget-=DUR;n++;t+=DUR;
      const rd=n%2===0?30:10;
      if(budget>=DUR&&t+rd+DUR<=end){out.push({id:`r${d}-${t}`,day:d,start:t,dur:rd,type:'rest',label:rd===30?'Descanso largo':'Descanso'});occ[d].push([t,t+rd]);t+=rd}
    }
  }
  return out.sort((a,b)=>a.day-b.day||a.start-b.start);
}
const nextBlock=plan=>plan.filter(b=>b.type==='study'&&!b.done)[0]||null;

/* ---------- Modo Rescate: interpreta el texto y arma el plan de emergencia ---------- */
function parseRescue(text,subjects){
  const x=norm(text),found=[];
  const keys={fis:['fisiolog'],ana:['anatom'],bio:['bioquim']};
  subjects.forEach(s=>{
    const ks=keys[s.id]||[norm(s.name).slice(0,6)];let idx=-1;
    ks.forEach(k=>{const i=x.indexOf(k);if(i>=0&&(idx<0||i<idx))idx=i});
    if(idx<0)return;
    const rx=/(\d+)\s*dias?|manana|una semana|dos semanas/;
    let seg=x.slice(idx,idx+90),m=seg.match(rx);
    if(!m){seg=x.slice(Math.max(0,idx-40),idx);m=seg.match(rx)}
    let days=null;
    if(m){days=m[1]?+m[1]:m[0]==='manana'?1:m[0]==='una semana'?7:14}
    found.push({id:s.id,name:s.name,days:days??s.exam,guess:days==null});
  });
  const cover=/nada|no estudie|nunca/.test(x)?.1:/poco|casi/.test(x)?.25:.4;
  return {items:found,cover};
}
function rescuePlan(subjects,mastery,items,hours,cover,startMin){
  const nb=Math.max(2,Math.min(5,Math.floor((hours*60+10)/55)));
  const al=items.map(it=>{const s=subjects.find(x=>x.id===it.id);return {s,days:it.days,w:s.diff*(1.5-cover)/Math.pow(Math.max(it.days,1),.8)}});
  const tot=al.reduce((a,x)=>a+x.w,0);
  al.forEach(a=>{a.q=a.w/tot*nb;a.n=Math.floor(a.q)});
  let left=nb-al.reduce((a,x)=>a+x.n,0);
  [...al].sort((a,b)=>(b.q-b.n)-(a.q-a.n)).slice(0,left).forEach(a=>a.n++);
  if(nb>=al.length)al.forEach(a=>{if(a.n===0){const big=al.reduce((m,x)=>x.n>m.n?x:m,al[0]);big.n--;a.n=1}});
  const qs=al.map(a=>{const pri=a.s.topics.filter(t=>t.level!=='comp').sort((x,y)=>LV[y.level].w*y.freq*(100-mastery[y.id])-LV[x.level].w*x.freq*(100-mastery[x.id]));const picks=[];for(let i=0;i<a.n;i++)picks.push({t:pri[i%pri.length],rep:i>=pri.length});return {a,picks}});
  const seq=[];let lastS=null;
  while(qs.some(q=>q.picks.length)){const c=qs.filter(q=>q.picks.length).sort((x,y)=>y.picks.length-x.picks.length||y.a.w-x.a.w);const q=c.find(z=>z.a.s.id!==lastS)||c[0];const p=q.picks.shift();seq.push({s:q.a.s,t:p.t,rep:p.rep,days:q.a.days});lastS=q.a.s.id}
  let t=startMin;const blocks=[];
  seq.forEach((b,i)=>{blocks.push({type:'study',start:t,dur:45,...b});t+=45;if(i<seq.length-1){const rd=i===2?20:10;blocks.push({type:'rest',start:t,dur:rd});t+=rd}});
  const dropped=[];
  al.forEach(a=>{const used=new Set(seq.filter(x=>x.s.id===a.s.id).map(x=>x.t.id));a.s.topics.forEach(tp=>{if(tp.level==='comp')dropped.push({s:a.s,t:tp,why:'Complementario: casi no aparece en parciales'});else if(!used.has(tp.id))dropped.push({s:a.s,t:tp,why:'Queda para después de hoy'})})});
  const daily=Math.min(300,hours*60);
  const perDay=al.map(a=>({s:a.s,days:a.days,min:Math.round(daily*a.w/tot/5)*5}));
  return {blocks,dropped,perDay,end:t};
}

/* Recalcula frecuencias y niveles a partir de los parciales (incluye los que subió la persona) */
function restat(s){
  if(!s.past.length)return s;
  return {...s,topics:s.topics.map(t=>{const c=s.past.filter(p=>p.t.includes(t.id)).length,f=Math.round(100*c/s.past.length);return {...t,count:c,total:s.past.length,freq:f,level:t.fromMat&&!c?t.level:f>=70?'muy':f>=40?'imp':'comp'}})};
}

};
const Icon=({n,s=18,sw=2})=>html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style=${{flex:'0 0 auto'}} dangerouslySetInnerHTML=${{__html:IC[n]||''}}/>`;
const Bar=({v})=>html`<div className="bar" role="progressbar" aria-valuenow=${Math.round(v)} aria-valuemin="0" aria-valuemax="100"><i style=${{width:Math.max(3,Math.min(100,v))+'%'}}/></div>`;

const Head=({eyebrow,title,sub,right})=>html`<div className="row" style=${{justifyContent:'space-between',alignItems:'flex-end',gap:12}}><div className="grow">${eyebrow&&html`<div className="eyebrow">${eyebrow}</div>`}<h1 style=${{fontSize:'clamp(26px,7vw,32px)',fontWeight:700,marginTop:4}}>${title}</h1>${sub&&html`<p className="mut" style=${{marginTop:6,fontSize:14}}>${sub}</p>`}</div>${right}</div>`;
const DNF=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MNF=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const thc=id=>['fis','ana','bio'].includes(id)?'th-'+id:'th-x';
const when=b=>`${dayLabel(b.day)} · ${hhmm(b.start)}`;
const HChip=({children})=>html`<span className="lvl" style=${{background:'rgba(255,255,255,.24)',color:'#fff'}}>${children}</span>`;

/* ---------- 1 · AHORA ---------- */
function Ahora({a}){
  const {plan,subjects,mastery,run,stats,reviews}=a;
  const nb=nextBlock(plan);
  const [sub,setSub]=useState(subjects[0].id),[showC,setShowC]=useState(false);
  const cs=subjects.find(s=>s.id===sub)||subjects[0];
  const todayS=plan.filter(b=>b.type==='study'&&b.day===0);
  const list=todayS.length?todayS:plan.filter(b=>b.type==='study'&&!b.done).slice(0,4);
  const why=b=>{const {s,t}=findT(subjects,b.topic),l=[];
    l.push(t.fromMat?`Es un tema de tu material (${t.src||'tus apuntes'}): calculamos ~${t.blocks||1} bloques de 45 min.`:t.total?`Aparece en ${t.count} de ${t.total} parciales anteriores (${t.freq}%).`:'Es una unidad central de la materia.');
    l.push(`${s.name} rinde en ${a.examOf(s)} días y hoy dominás este tema en un ${mastery[t.id]}%.`);
    if(b.review)l.push('Es un repaso: fallaste una pregunta de este tema.');
    if(a.slow[t.id])l.push('Subió de prioridad porque tardaste más de lo previsto.');
    return l};
  let hero;
  if(run&&run.phase==='rest'){
    hero=html`<div className="hero th-ana"><div className="eyebrow row"><${Icon} n="coffee" s=${14}/> Descanso obligatorio</div>
      <div className="timer" style=${{margin:'16px 0'}}>${mmss(run.left)}</div>
      <p style=${{opacity:.92}}>Levantate, tomá agua, mirá algo lejano. El próximo bloque se habilita al terminar.</p>
      <div className="row wrap" style=${{marginTop:18}}><button className="btn btn-i" disabled=${run.left>0} onClick=${a.endRest}><${Icon} n="check" s=${16}/> Ya descansé</button><button className="btn btn-ghost" onClick=${a.skipRest}>Saltear</button></div></div>`;
  }else if(run&&run.phase==='running'){
    const {s,t}=findT(subjects,run.block.topic);
    const ex=t.body?{src:t.src,body:t.body}:excerptFor(a.mats.filter(m=>m.subj===s.id&&m.text),t.name);
    hero=html`<div className=${'hero '+thc(s.id)}><div className="eyebrow">En curso · ${s.name}</div>
      <h2 style=${{fontSize:'clamp(24px,7vw,30px)',fontWeight:700,marginTop:6}}>${t.name}</h2>
      <div className="timer" style=${{margin:'16px 0 12px'}}>${mmss(run.left)}</div>
      <div style=${{background:'rgba(255,255,255,.28)',height:8,borderRadius:99,overflow:'hidden'}}><i style=${{display:'block',height:'100%',background:'#fff',borderRadius:99,width:(100*(1-run.left/run.total))+'%'}}/></div>
      <div className="row wrap" style=${{marginTop:20}}><button className="btn btn-i btn-big" onClick=${a.finishRun}><${Icon} n="check" s=${18}/> Terminé</button>
        <button className="btn btn-ghost" onClick=${a.togglePause}><${Icon} n=${run.paused?'play':'pause'} s=${16}/> ${run.paused?'Seguir':'Pausar'}</button>
        <button className="btn btn-ghost" onClick=${a.slower}><${Icon} n="clock" s=${16}/> Me tardé más</button></div>
      ${ex?html`<details style=${{marginTop:16,background:'rgba(255,255,255,.92)',color:'#1d1d2b',borderRadius:18,padding:'12px 14px'}} open><summary style=${{fontWeight:600,cursor:'pointer'}}>📎 Estudiá con tu material${ex.src?' · '+ex.src:''}</summary><div style=${{marginTop:8,fontSize:14,whiteSpace:'pre-wrap',maxHeight:320,overflow:'auto',lineHeight:1.5}}>${ex.body}</div></details>`
        :html`<p style=${{marginTop:14,fontSize:13,opacity:.9}}>Tip: subí tus apuntes de ${s.name} en "Apuntes" y acá vas a ver la parte de este tema.</p>`}</div>`;
  }else if(nb){
    const {s,t}=findT(subjects,nb.topic),w=why(nb);
    hero=html`<div className=${'hero '+thc(s.id)}>
      <div className="row" style=${{justifyContent:'space-between'}}><span className="eyebrow">Siguiente bloque · ${when(nb)}</span></div>
      <div className="row" style=${{marginTop:14,alignItems:'center'}}><span className="tile">${s.emoji}</span><div className="grow"><p style=${{fontSize:13.5,opacity:.92}}>${s.name} · <span className="num">${nb.dur} min</span></p><h2 style=${{fontSize:'clamp(24px,7vw,30px)',fontWeight:700}}>${t.name}</h2></div></div>
      <div className="chips" style=${{marginTop:14}}><${HChip}>${LV[t.level].name}</${HChip}>${nb.review&&html`<${HChip}>Repaso</${HChip}>`}</div>
      <p style=${{marginTop:12,fontSize:13.5,opacity:.95}}>${w[0]}</p>
      <div className="row wrap" style=${{marginTop:18}}><button className="btn btn-i btn-big" onClick=${()=>a.startRun(nb)}><${Icon} n="play" s=${18}/> Empezar</button><button className="btn btn-ghost" onClick=${()=>a.openTutor(t.id)}><${Icon} n="sparkle" s=${16}/> Explicámelo</button></div></div>`;
  }else{
    hero=html`<div className="card"><h2 style=${{fontSize:22}}>No hay bloques pendientes.</h2><p className="mut" style=${{marginTop:6}}>Revisá tu horario preferido o el límite de horas en la configuración.</p></div>`;
  }
  const exams=[...subjects].sort((x,y)=>a.examOf(x)-a.examOf(y));
  const d0=dateOf(0);
  const ts=[...visT(cs)].sort((x,y)=>LV[y.level].w-LV[x.level].w).filter(t=>t.level!=='comp');
  return html`<div className="screen" style=${{padding:0,gap:22}}>
    <div className="row" style=${{justifyContent:'space-between',alignItems:'flex-start'}}>
      <div className="grow"><h1 style=${{fontSize:'clamp(28px,8vw,34px)',fontWeight:700}}>${DNF[d0.getDay()]} ${d0.getDate()}</h1><p className="mut" style=${{fontSize:14,marginTop:2}}>${todayS.length?`${todayS.filter(b=>!b.done).length} de ${todayS.length} bloques pendientes`:'Tus próximos bloques'}</p></div>
      <div className="row" style=${{gap:8}}><button className="ibtn meav" onClick=${a.openPerfil} aria-label="Mi perfil" style=${{background:'var(--g-lilac)',color:'#fff',fontWeight:600,fontSize:14}}>${initials(a.user.nombre)}</button><button className="ibtn" onClick=${a.openOnb} aria-label="Configuración"><${Icon} n="settings" s=${19}/></button><button className="ibtn" onClick=${a.flipTheme} aria-label=${a.isDark?'Modo claro':'Modo oscuro'}><${Icon} n=${a.isDark?'sun':'moon'} s=${19}/></button></div></div>
    ${SHOW_PAY&&a.sub&&a.sub.in_trial&&!(a.sub.subscription&&a.sub.subscription.status==='authorized')&&daysLeft(a.sub.trial_ends_at)<=7&&html`<button className="alertbox" onClick=${a.openPerfil} style=${{textAlign:'left',border:0,width:'100%',color:'var(--ink)',background:'var(--t-mint)',fontSize:13.5}}>Te quedan <b>${daysLeft(a.sub.trial_ends_at)} días</b> de prueba gratis. Tocá para ver tu suscripción.</button>`}
    ${a.rescue&&html`<div className="alertbox row wrap" style=${{justifyContent:'space-between'}}><span className="row"><${Icon} n="alert"/> <b>Modo Rescate activo</b></span><button className="btn btn-sm" onClick=${a.stopRescue}>Desactivar</button></div>`}
    ${hero}
    ${list.length>0&&html`<div className="fl" style=${{gap:10}}><div className="row" style=${{justifyContent:'space-between'}}><h2 style=${{fontSize:18,fontWeight:600}}>${todayS.length?'Hoy':'Próximos bloques'}</h2><button className="chip" onClick=${()=>a.go('calendario')}>Ver plan completo</button></div>
      ${list.filter(b=>b!==nb).slice(0,3).map(b=>{const f=findT(subjects,b.topic);if(!f)return null;const {s,t}=f;return html`<div key=${b.id} className=${'rowt '+thc(s.id)}><span className="tile">${s.emoji}</span><div className="grow" style=${{minWidth:0}}><b style=${{fontWeight:500,display:'block'}}>${t.name}</b><span className="mut num" style=${{fontSize:13}}>${todayS.length?hhmm(b.start):dayLabel(b.day)+' '+hhmm(b.start)} · ${b.dur} min${b.review?' · repaso':''}</span></div>${b.done?html`<span className="pillb"><${Icon} n="check" s=${14}/> Hecho</span>`:html`<button className="pillb" disabled=${!!run} onClick=${()=>a.startRun(b)}>Empezar</button>`}</div>`})}</div>`}
    <div className="fl" style=${{gap:8}}><h2 style=${{fontSize:18,fontWeight:600}}>Parciales</h2>
      <div className="chips">${exams.map(s=>{const d=a.examOf(s);return html`<button key=${s.id} className="lvl" onClick=${()=>a.go('calendario')} style=${{border:0,background:d<=10?'var(--t-rose)':d<=20?'var(--t-cream)':'var(--t-blue)',color:'var(--ink)',fontSize:13,padding:'.4rem .8rem'}}>${s.emoji} ${s.name} · <b className="num">${d===1?'mañana':'en '+d+' días'}</b></button>`})}</div></div>
    <div className="chips" role="group" aria-label="Accesos rápidos">
      ${[['ejercicios','✏️ Practicar'+(reviews.length?' ('+reviews.length+')':'')],['simulador','⏱️ Simulacro'],['material','📎 Mis apuntes'],['rescate','🚨 Modo rescate'],['logros','🔥 Racha de '+stats.streak+' días']].map(([k,l])=>html`<button key=${k} className="chip" onClick=${()=>a.go(k)}>${l}</button>`)}
      <button className="chip" aria-expanded=${showC} onClick=${()=>setShowC(!showC)}>🎯 Qué importa más</button></div>
    ${showC&&html`<div className="fl" style=${{gap:10}}>
      <div className="scrollx">${subjects.map(s=>html`<button key=${s.id} className="chip" style=${{flex:'0 0 auto'}} aria-pressed=${s.id===cs.id} onClick=${()=>setSub(s.id)}>${s.emoji} ${s.name}</button>`)}</div>
      <div className="fl" style=${{gap:8}}>${ts.slice(0,5).map(t=>html`<button key=${t.id} className=${'trow '+thc(cs.id)} onClick=${()=>a.openTutor(t.id)}><span className="grow"><b style=${{fontWeight:500,display:'block'}}>${t.name}</b><span className="mut" style=${{fontSize:12.5}}>${t.fromMat?'📎 '+(t.src||'tu material')+' · ~'+(t.blocks||1)+' bloques':t.total?`${t.count} de ${t.total} parciales`:'Unidad central'} · dominio <span className="num">${mastery[t.id]}%</span></span></span><${LevelTag} lv=${t.level}/></button>`)}</div></div>`}
  </div>`;
}

/* ---------- 3 · CALENDARIO ---------- */
function Calendario({a}){
  const {plan,subjects}=a;
  const [wk,setWk]=useState(0),[day,setDay]=useState(0),[open,setOpen]=useState(null),[form,setForm]=useState(null),[err,setErr]=useState(null),[del,setDel]=useState(null);
  const days=[...Array(7)].map((_,i)=>wk*7+i);
  const items=plan.filter(b=>b.day===day&&(b.type==='study'||b.type==='event')).sort((x,y)=>x.start-y.start),exams=plan.filter(b=>b.day===day&&b.type==='exam');
  const dd=dateOf(day),sn=id=>(subjects.find(s=>s.id===id)||{name:id}).name;
  const goW=w=>{setWk(w);setDay(w*7);setOpen(null)};
  const tm=m=>hhmm(Math.max(0,Math.min(1439,m)));
  const toMin=v=>{const [h,m]=String(v||'').split(':').map(Number);return Number.isFinite(h)?h*60+(m||0):NaN};
  const newForm=()=>{setErr(null);setForm({title:'',kind:'clase',subj:'',date:ymd(Math.max(day,0)),from:'09:00',to:'11:00',weekly:false})};
  const save=()=>{
    const f=form,st=toMin(f.from),en=toMin(f.to),d=dayIdx(f.date);
    if(f.kind==='parcial'&&!f.subj)return setErr('Elegí de qué materia es el parcial: así tu plan de estudio se organiza para llegar.');
    const title=f.title.trim()||(f.kind==='parcial'&&f.subj?'Parcial de '+sn(f.subj):'');
    if(title.length<2)return setErr('Escribí un nombre (ej: Clase práctica, Trabajo, Entrega del informe).');
    if(!f.date||!Number.isFinite(d))return setErr('Elegí la fecha.');
    if(d<0)return setErr('Esa fecha ya pasó.');
    if(!Number.isFinite(st)||!Number.isFinite(en)||en<=st)return setErr('La hora de fin tiene que ser después de la de inicio.');
    a.addEvent({id:gid(),title:title.slice(0,80),kind:f.kind,subj:f.subj||null,date:f.date,start:st,end:en,weekly:!!f.weekly&&f.kind!=='parcial'&&f.kind!=='entrega'});
    setForm(null);setDay(d);setWk(Math.min(2,Math.floor(d/7)));
  };
  const upcoming=[...plan.filter(b=>b.type==='exam').map(b=>({d:b.day,name:sn(b.subj),t:null})),...plan.filter(b=>b.type==='event'&&b.ev.kind==='parcial').map(b=>({d:b.day,name:b.ev.subj?sn(b.ev.subj):b.ev.title,t:b.start}))].sort((x,y)=>x.d-y.d);
  return html`<div className="screen" style=${{padding:0}}>
    <${Head} eyebrow=${dd.getFullYear()} title=${MNF[dd.getMonth()]} right=${html`<div className="row" style=${{gap:6}}><button className="ibtn" disabled=${wk===0} aria-label="Semana anterior" onClick=${()=>goW(wk-1)}><${Icon} n="chevL" s=${18}/></button><button className="ibtn" disabled=${wk===2} aria-label="Semana siguiente" onClick=${()=>goW(wk+1)}><${Icon} n="chevR" s=${18}/></button></div>`}/>
    <div style=${{display:'grid',gridTemplateColumns:'repeat(7,minmax(0,1fr))',gap:6}}>${days.map(d=>{const n=plan.filter(b=>b.day===d&&b.type==='study').length,ex=plan.some(b=>b.day===d&&(b.type==='exam'||(b.type==='event'&&b.ev.kind==='parcial'))),ev=plan.some(b=>b.day===d&&b.type==='event');return html`<button key=${d} className="dc" aria-pressed=${day===d} aria-label=${dayLabel(d)} onClick=${()=>{setDay(d);setOpen(null)}}><small>${DN[dateOf(d).getDay()]}</small><b className="num">${dateOf(d).getDate()}</b><span style=${{height:12,display:'flex',gap:3,alignItems:'center'}}>${ex?html`<${Icon} n="alert" s=${12} sw=${2.5}/>`:[...Array(Math.min(3,n))].map((_,i)=>html`<i key=${i} style=${{width:5,height:5,borderRadius:'50%',background:'currentColor',opacity:.55,display:'block'}}/>`)}${ev&&!ex&&html`<i style=${{width:5,height:5,borderRadius:1,background:'currentColor',display:'block'}}/>`}</span></button>`})}</div>
    <div className="row wrap" style=${{justifyContent:'space-between',gap:8}}><h2 style=${{fontSize:20,fontWeight:600}}>${day===0?'Hoy':dayLabel(day)}</h2><button className="btn btn-sm btn-s" onClick=${()=>form?setForm(null):newForm()}><${Icon} n=${form?'x':'plus'} s=${14}/> ${form?'Cerrar':'Agregar al calendario'}</button></div>
    ${form&&html`<div className="card fl" style=${{gap:12}}>
      <b>Agregar algo tuyo</b>
      <div className="chips" role="group" aria-label="Tipo">${Object.entries(EVK).map(([k,v])=>html`<button key=${k} className="chip" aria-pressed=${form.kind===k} onClick=${()=>{setForm({...form,kind:k});setErr(null)}}>${v[0]} ${v[1]}</button>`)}</div>
      <div><label htmlFor="ev-t" style=${{fontWeight:600,fontSize:14}}>Nombre</label><input id="ev-t" maxLength="80" placeholder=${{clase:'Ej: Práctico de Anatomía',trabajo:'Ej: Turno en el trabajo',parcial:'Ej: Primer parcial',entrega:'Ej: Entrega del informe',otro:'Ej: Gimnasio, médico, cumpleaños'}[form.kind]} value=${form.title} onInput=${e=>{setForm({...form,title:e.target.value});setErr(null)}}/></div>
      <div><label htmlFor="ev-s" style=${{fontWeight:600,fontSize:14}}>Materia ${form.kind==='parcial'?'':html`<span className="mut" style=${{fontWeight:400}}>(opcional)</span>`}</label><select id="ev-s" value=${form.subj} onChange=${e=>{setForm({...form,subj:e.target.value});setErr(null)}}><option value="">${form.kind==='parcial'?'Elegí la materia…':'Ninguna'}</option>${subjects.map(s=>html`<option key=${s.id} value=${s.id}>${s.emoji} ${s.name}</option>`)}</select></div>
      <div className="grid2" style=${{gap:10}}>
        <div><label htmlFor="ev-d" style=${{fontWeight:600,fontSize:14}}>Fecha</label><input id="ev-d" type="date" min=${ymd(0)} value=${form.date} onChange=${e=>{setForm({...form,date:e.target.value});setErr(null)}}/></div>
        <div className="row" style=${{gap:8}}><div className="grow"><label htmlFor="ev-f" style=${{fontWeight:600,fontSize:14}}>Desde</label><input id="ev-f" type="time" step="300" value=${form.from} onChange=${e=>{setForm({...form,from:e.target.value});setErr(null)}}/></div><div className="grow"><label htmlFor="ev-h" style=${{fontWeight:600,fontSize:14}}>Hasta</label><input id="ev-h" type="time" step="300" value=${form.to} onChange=${e=>{setForm({...form,to:e.target.value});setErr(null)}}/></div></div></div>
      ${form.kind!=='parcial'&&form.kind!=='entrega'&&html`<label className="row" style=${{gap:8,fontSize:13.5,cursor:'pointer'}}><input type="checkbox" checked=${form.weekly} onChange=${e=>setForm({...form,weekly:e.target.checked})} style=${{width:18,height:18,flex:'0 0 18px',accentColor:'var(--ink)'}}/> Se repite todas las semanas</label>`}
      <p className="mut" style=${{fontSize:12.5}}>${form.kind==='parcial'?'Tu plan de estudio se reorganiza para llegar preparado/a a esa fecha.':'En ese horario no te vamos a poner bloques de estudio.'}</p>
      ${err&&html`<div className="alertbox" role="alert" style=${{background:'var(--t-rose)'}}>${err}</div>`}
      <div className="row wrap" style=${{gap:8}}><button className="btn btn-s" onClick=${save}><${Icon} n="check" s=${16}/> Guardar</button><button className="btn" onClick=${()=>setForm(null)}>Cancelar</button></div></div>`}
    <div className="fl" style=${{gap:12}}>
      ${exams.map(e=>html`<div key=${e.id} className="row" style=${{background:'var(--inv)',color:'var(--invfg)',borderRadius:24,padding:'14px 18px'}}><span style=${{fontSize:26}}>📝</span><div><b>Parcial de ${sn(e.subj)}</b><p style=${{fontSize:13,opacity:.7}}>Descansá bien la noche anterior.</p></div></div>`)}
      ${items.length===0&&exams.length===0&&html`<div className="card"><p className="mut">No hay bloques de estudio este día. Aprovechá para descansar.</p></div>`}
      ${items.map(b=>{
        if(b.type==='event'){const e=b.ev,k=EVK[e.kind]||EVK.otro,isP=e.kind==='parcial';return html`<div key=${b.id} className="tl"><time className="num">${tm(b.start)}</time><div className="card fl" style=${{gap:6,padding:'12px 16px',...(isP?{background:'var(--inv)',color:'var(--invfg)'}:{})}}>
          <div className="row wrap" style=${{justifyContent:'space-between',gap:8}}><b style=${{fontWeight:600}}>${k[0]} ${e.title}</b><span className="num" style=${{fontSize:12.5,opacity:.75}}>${tm(e.start)}–${tm(e.end)}</span></div>

function Simulador({a}){
  const {subjects}=a;
  const [ph,setPh]=useState('cfg'),[cfg,setCfg]=useState(()=>a.simInit||{s:'fis',n:10,min:20,ex:2,mine:false}),[run,setRun]=useState(null),[rep,setRep]=useState(null);

    const pct=Math.round(100*ok/r.qs.length),th=[0,50,60,70][cfg.ex]||60;

  useEffect(()=>{if(ph==='run'&&run&&run.left<=0)finish(run)},[ph,run&&run.left]);
  const start=()=>{setRun({qs:shuffle(pool).slice(0,n),i:0,ans:{},left:cfg.min*60,total:cfg.min*60});setPh('run')};
  const tn=id=>(findT(subjects,id)||{t:{name:id}}).t.name;

        <h2 style=${{fontSize:'clamp(20px,3.6vw,26px)',fontWeight:700,lineHeight:1.25}}>${q.q}</h2>

const _ls={};

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),ms))]);

async function openPdf(file){

async function pdfPages(file,max){
  const pdf=await openPdf(file),out=[];
  for(let i=1;i<=Math.min(pdf.numPages,max);i++){
    const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.6}),c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,'image/png')));
  }
  return out;
}
async function extractText(file){
  const n=(file.name||'').toLowerCase(),ty=file.type||'';
  if(ty.startsWith('image/')||/\.(png|jpe?g|webp|gif|heic|heif)$/.test(n))return {img:true};
  if(/\.(txt|md|csv|json|rtf)$/.test(n)||ty.startsWith('text/')){
    let t=await readText(file);
    if(n.endsWith('.rtf'))t=t.replace(/\\'[0-9a-f]{2}/gi,'').replace(/\\[a-z]+-?\d* ?/gi,' ').replace(/[{}]/g,'');
    return {text:t};
  }
  if(n.endsWith('.docx')){
    await loadScript(JSZ);
    const z=await window.JSZip.loadAsync(await file.arrayBuffer()),f=z.file('word/document.xml');
    if(!f)throw new Error('Ese Word no tiene el formato esperado. Guardalo de nuevo como .docx o PDF.');
    const x=await f.async('string');
    return {text:x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<w:br\/>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")};
  }
  if(n.endsWith('.pptx')){
    await loadScript(JSZ);
    const z=await window.JSZip.loadAsync(await file.arrayBuffer());
    const names=Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((x,y)=>parseInt(x.match(/\d+/)[0])-parseInt(y.match(/\d+/)[0]));
    if(!names.length)throw new Error('No encontré diapositivas en ese archivo.');
    let out='';
    for(const k of names){const x=await z.file(k).async('string');out+='Diapositiva '+(names.indexOf(k)+1)+'\n'+x.replace(/<\/a:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")+'\n\n'}
    return {text:out};
  }
  if(n.endsWith('.doc')||n.endsWith('.ppt'))throw new Error('Ese formato viejo (.doc o .ppt) no se puede leer. Guardalo como .docx, .pptx o PDF.');
  if(n.endsWith('.pdf')||ty==='application/pdf'){
    const pdf=await openPdf(file);
    let out='';
    for(let i=1;i<=Math.min(pdf.numPages,80)&&out.length<MAXCH;i++){
      const pg=await pdf.getPage(i),tc=await pg.getTextContent();
      out+=tc.items.map(it=>it.str+(it.hasEOL?'\n':'')).join(' ')+'\n\n';
    }
    if(out.replace(/\s/g,'').length<40)return {scan:true};
    return {text:out};
  }
  throw new Error('Formato no compatible');
}

const aiErr=c=>({not_granted:'Necesito tu permiso para usar la IA.',sampling_disabled:'La IA no está habilitada en esta vista.',rate_limited:'Llegaste al límite de uso por ahora. Probá más tarde.',prompt_too_large:'Hay demasiado texto. Quitá algún archivo y probá de nuevo.',invalid_json:'La IA devolvió algo que no pude leer. Probá de nuevo.',refused:'La IA no pudo procesar ese material.',images_unavailable:'Acá no se pueden leer fotos con IA.',image_rejected:'No pude leer esa imagen. Probá con otra foto.'}[c]||'No pude completar la acción. Probá de nuevo.');

/* Valida una pregunta devuelta por la IA y la convierte al formato del banco */
let MQ=0;
function mkQ(x,sid,topics){
  if(!x||typeof x.q!=='string'||!x.q.trim())return null;
  const type=['mc','vf','sc','caso'].includes(x.type)?x.type:null;if(!type)return null;
  const tid=topics.some(t=>t.id===x.topic)?x.topic:(topics.find(t=>t.level==='muy')||topics[0]).id;
  const lvl=[1,2,3].includes(+x.lvl)?+x.lvl:2;
  const base={id:'m'+(++MQ),s:sid,t:tid,type,lvl,q:x.q.trim(),ex:String(x.ex||'').trim()||'Revisá tu material sobre este tema.',mine:true};
  if(type==='vf'){if(x.a!==true&&x.a!==false)return null;return {...base,opts:['Verdadero','Falso'],a:x.a?0:1}}
  if(type==='sc'){const k=(Array.isArray(x.a)?x.a:[x.a]).map(v=>String(v||'').trim()).filter(Boolean).slice(0,4);if(!k.length)return null;return {...base,a:k}}
  if(!Array.isArray(x.opts)||x.opts.length!==4||!Number.isInteger(x.a)||x.a<0||x.a>3)return null;
  const opts=x.opts.map(o=>String(o)),right=opts[x.a],sh=shuffle(opts);
  return {...base,opts:sh,a:sh.indexOf(right)};
}

/* Detección local de temas (sin IA): el nombre del tema, o todas sus palabras clave, aparecen en el texto */
function localTopics(text,topics){
  const t=fold(text);
  return topics.filter(tp=>{const nm=fold(tp.name);if(t.includes(nm))return true;const w=nm.split(/\s+/).filter(x=>x.length>=5);return w.length>=2&&w.every(x=>t.includes(x))}).map(tp=>tp.id);
}
/* Búsqueda local */
function searchMats(mats,q){
  const k=fold(q.trim());if(k.length<3)return [];
  const out=[];
  mats.forEach(m=>{if(!m.text)return;const t=fold(m.text);let from=0,c=0;while(c<2){const i=t.indexOf(k,from);if(i<0)break;const a=Math.max(0,i-70),b=Math.min(m.text.length,i+k.length+110);out.push({m,i,pre:(a?'…':'')+m.text.slice(a,i).replace(/\s+/g,' '),hit:m.text.slice(i,i+k.length),post:m.text.slice(i+k.length,b).replace(/\s+/g,' ')+(b<m.text.length?'…':'')});from=i+k.length;c++}});
  return out.slice(0,8);
}

/* Sin IA: frases del material, respuestas por coincidencia de palabras y ejercicios de completar / V-F */
const STOPW=new Set('para como pero porque cuando donde entre sobre desde hasta este esta estos estas tiene tienen puede pueden tambien cada otro otra otros otras mismo misma ellos ellas habia hacer segun durante despues antes mientras siempre nunca todos todas parte forma manera cual cuales que quien explicame decime dame sobre esto eso aquello tengo hace hacen mucho muchos poco pocos donde'.split(' '));
const keyWords=t=>[...new Set(fold(t).match(/[a-zñ]{4,}/g)||[])].filter(w=>!STOPW.has(w));
const sentencesOf=t=>String(t||'').split(/\n+|(?<=[.!?])\s+/).map(x=>x.replace(/\s+/g,' ').replace(/^[-*•·\d.)\s]+/,'').trim()).filter(x=>x.length>=40&&x.length<=320);
function localAnswer(mats,q){
  const kw=keyWords(q).map(w=>w.length>6?w.slice(0,w.length-2):w);if(!kw.length)return null;
  const hits=[];
  mats.forEach(m=>sentencesOf(m.text).forEach((x,i)=>{const f=fold(x),sc=kw.filter(w=>f.includes(w)).length;if(sc)hits.push({m,i,x,sc})}));
  const need=kw.length>2?2:1,top=hits.filter(h=>h.sc>=need).sort((x,y)=>y.sc-x.sc).slice(0,3);
  if(!top.length)return null;
  return top.sort((x,y)=>x.m===y.m?x.i-y.i:0).map(h=>'- '+h.x+' ('+h.m.name+')').join('\n');
}
function localQs(mats,n,sid,topics,type){
  const all=[];
  mats.forEach(m=>sentencesOf(m.text).forEach(x=>{const ws=[...new Set(x.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{7,}/g)||[])].filter(w=>!STOPW.has(fold(w)));if(ws.length)all.push({m,x,ws})}));
  const pool=shuffle(all),used=new Set(),out=[],def=(topics.find(t=>t.level==='muy')||topics[0]).id;
  const words=all.flatMap(c=>c.ws);
  for(const c of pool){
    if(out.length>=n)break;
    const w=c.ws.filter(x=>!used.has(fold(x))).sort((x,y)=>y.length-x.length)[Math.random()<.5?0:1]||c.ws[0];
    if(used.has(fold(w)))continue;used.add(fold(w));
    const i=c.x.indexOf(w),tid=localTopics(c.x,topics)[0]||def,lvl=w.length>10?2:1;
    const base={id:'m'+(++MQ),s:sid,t:tid,lvl,mine:true,ex:'Según '+c.m.name+': '+c.x};
    const asVf=type==='vf'||(type!=='sc'&&out.length%3===2);
    if(asVf){
      const alt=shuffle(words.filter(x=>fold(x)!==fold(w)&&!c.x.includes(x)))[0];
      const truth=!alt||Math.random()<.5,txt=truth?c.x:c.x.slice(0,i)+alt+c.x.slice(i+w.length);
      out.push({...base,type:'vf',q:'Verdadero o falso, según tu material: "'+txt+'"',opts:['Verdadero','Falso'],a:truth?0:1,ex:(truth?'Es así. ':'Es falso: la palabra correcta es "'+w+'". ')+base.ex});
    }else out.push({...base,type:'sc',q:'Completá la frase de tu material ('+c.m.name+'):\n"'+c.x.slice(0,i)+'_____'+c.x.slice(i+w.length)+'"',a:[w.toLowerCase()]});
  }
  return out;
}

    const failed=a.errors.slice(-12).map(e=>QBANK.find(x=>x.id===e.q)).filter(x=>x&&x.s===subj).slice(-5).map(x=>'"'+x.q.slice(0,140)+'"');
    const lv=xc.lvl?'Todas de dificultad '+['','fácil (lvl 1: definiciones y reconocimiento)','media (lvl 2: relacionar conceptos)','difícil (lvl 3: aplicar, integrar y analizar)'][xc.lvl]+'.':'Escalá la dificultad: de fácil a difícil.';
    const per=xc.weak&&(weak.length||failed.length)?' Personalizalo: alrededor de la mitad tiene que reforzar donde le va peor'+(weak.length?' — temas flojos: '+weak.join('; '):'')+(failed.length?' — conceptos de preguntas que falló: '+failed.join('; '):'')+', siempre que el material los cubra.':'';
    const p='Armá '+xc.n+' ejercicios de práctica personalizados de '+s.name+' para alguien de '+a.prefs.carrera+' (año '+a.prefs.anio+'), con el parcial en '+d+' días, basados SOLO en este material del estudiante (si es de parciales anteriores, imitá su estilo). No repitas preguntas literales del material: hacé que piense. '+XT[xc.type]+'. '+lv+per+' En "ex" explicá por qué y citá el archivo del material entre paréntesis.\nDevolvé SOLO un array JSON. Cada elemento: {"type":"mc"|"vf"|"sc"|"caso","topic":"<id de tema>","lvl":1|2|3,"q":"enunciado","opts":["A","B","C","D"] (solo mc y caso),"a":valor,"ex":"explicación breve"}. En "a": para mc y caso el índice 0-3 de la opción correcta; para vf true o false; para sc un array de 1 a 4 palabras clave cortas en minúscula que debe contener una respuesta correcta. Español rioplatense. Temas válidos (id = nombre): '+topicList+'.\n\nMATERIAL:\n'+ctx;
    const r=await ai.json(p,{cache:false,signal:sig});
    const arr=Array.isArray(r)?r:(r&&Array.isArray(r.questions)?r.questions:[]);
    const ok=arr.map(x=>mkQ(x,subj,s.topics)).filter(Boolean);
    if(!ok.length){setErr('No pude armar ejercicios con ese material. Probá con más texto.');return}
    QBANK.push(...ok);a.bumpQ();setNote('Listo: sumé '+ok.length+' ejercicios personalizados de tu material. Tocá "Practicar" para resolverlos.');
  });
  const makeSyl=()=>{
    const src=usable;
    if(!aiOk){const r=localSyllabus(src);if(r.length<2){setErr('No pude separar tus documentos en temas. Probá poniéndole un título a cada tema (una línea corta antes de cada parte).');return}setErr(null);setSyl(r);return}
    run('syl',async sig=>{
      const ctx=a.matContext(subj,60000);
      const p='Sos un tutor universitario. Dividí el material de '+s.name+' ('+a.prefs.carrera+') que subió el estudiante en los TEMAS de estudio que contiene, en el orden en que aparecen (entre 4 y 12). Usá los parciales anteriores (si hay) para decidir la importancia. Devolvé SOLO un array JSON. Cada elemento: {"name":"nombre corto del tema","pts":["3 a 5 ideas clave, concretas, sacadas del material"],"ana":"una analogía simple","tec":"explicación técnica de 2 o 3 frases según el material","level":"muy"|"imp"|"comp","blocks":número de bloques de 45 minutos que lleva estudiarlo (1 a 6, según extensión y dificultad),"src":"nombre exacto del archivo donde está"}. Español rioplatense. No inventes temas que no estén en el material.\n\nMATERIAL:\n'+ctx;
      const r=await ai.json(p,{cache:false,signal:sig});
      const arr=(Array.isArray(r)?r:(r&&(r.topics||r.temas))||[]).filter(x=>x&&typeof x.name==='string'&&x.name.trim());
      if(arr.length<2){setErr('No pude separar tu material en temas. Probá con más texto.');return}
      setSyl(arr.slice(0,12).map(x=>{const ex=excerptFor(src.filter(m=>!x.src||m.name===x.src).concat(src),x.name);return {name:x.name.trim().slice(0,70),pts:(Array.isArray(x.pts)?x.pts:[]).map(String).filter(Boolean).slice(0,5),ana:String(x.ana||''),tec:String(x.tec||''),level:['muy','imp','comp'].includes(x.level)?x.level:'imp',blocks:Math.max(1,Math.min(6,Math.round(+x.blocks)||2)),src:String(x.src||(ex&&ex.src)||''),body:ex?ex.body:''}}));
    });
  };
  const sylNeed=syl?syl.reduce((x,t)=>x+t.blocks,0)*45:0,sylHave=Math.max(0,d-1)*a.prefs.maxH*60;
  const useSyl=()=>{a.applySyllabus(subj,syl,only);setSyl(null);setNote('Listo: tu cronograma de '+s.name+' ahora se arma con los '+syl.length+' temas de tu material.')};
  const matTopics=s.topics.filter(t=>t.fromMat);
  const makeLocalQs=()=>{
    const src=ids?usable.filter(m=>ids.includes(m.id)):usable;
    const ok=localQs(src,xc.n,subj,s.topics,xc.type==='vf'?'vf':xc.type==='sc'?'sc':'mix');
    if(!ok.length){setErr('No encontré frases suficientes en tu material para armar ejercicios. Subí más texto.');return}
    setErr(null);QBANK.push(...ok);a.bumpQ();setNote('Listo: armé '+ok.length+' ejercicios para completar y de verdadero o falso con tu material. Tocá "Practicar" para resolverlos.');
  };
  const analyze=()=>run('exam',async sig=>{
    let items;
    if(ai){
      const ctx=a.matContext(subj,50000,['examen'],newExams.map(m=>m.id));
      const p='Estos son parciales anteriores de '+s.name+'. Para cada uno (bloques "### PARCIAL ANTERIOR: nombre") indicá qué temas evalúa. Devolvé SOLO un array JSON: [{"l":"nombre exacto del archivo","t":["id","id"]}]. Usá solamente estos ids (id = nombre): '+s.topics.map(t=>t.id+' = '+t.name).join('; ')+'.\n\n'+ctx;
      const r=await ai.json(p,{cache:false,signal:sig,modelTier:'quick'});
      const arr=Array.isArray(r)?r:(r&&Array.isArray(r.exams)?r.exams:[]);
      items=newExams.map(m=>{const f=arr.find(x=>x&&x.l===m.name)||arr[newExams.indexOf(m)];const ids=((f&&f.t)||[]).filter(i=>s.topics.some(t=>t.id===i));return {l:m.name,t:[...new Set(ids)],mine:true}});
    }else items=newExams.map(m=>({l:m.name,t:localTopics(m.text,s.topics),mine:true}));
    const n=a.addPastExams(subj,items);
    newExams.forEach(m=>a.updMat(m.id,{analyzed:true}));
    setNote(n?'Sumé '+n+(n>1?' parciales':' parcial')+' a tu análisis. Las prioridades de tu plan ya se recalcularon.':'No encontré temas conocidos en esos parciales.');
  });
  const readPhotos=()=>run('photo',async sig=>{
    const lim=await ai.limits();
    if(!lim||!lim.images)throw {code:'images_unavailable'};
    for(const m of imgs){
      const was=m.status;
      a.updMat(m.id,{status:'reading'});
      try{
        const f=BLOBS.get(m.id),pics=was==='scan'?await pdfPages(f,Math.min(lim.images.maxCount||4,6)):f;
        const r=await ai('Transcribí fielmente todo el texto de '+(was==='scan'?'estas páginas escaneadas':'esta foto')+' de apuntes o de un parcial (en su idioma original). Si hay esquemas o tablas, describilos en una línea entre corchetes. Devolvé solo la transcripción.',{cache:false,signal:sig,images:pics});
        const t=r.text.trim();a.updMat(m.id,t.length>20?{text:t,status:'ok',words:wordsOf(t)}:{status:'empty'});
      }catch(e){a.updMat(m.id,{status:was});throw e}
    }
  });
  const stop=()=>ctl.current&&ctl.current.abort();
  const stat=m=>m.status==='reading'?'Leyendo…':m.status==='ok'?(m.words||wordsOf(m.text))+' palabras':m.status==='img'?'Foto sin leer':m.status==='scan'?'PDF escaneado · sin texto':m.status==='empty'?'Sin texto legible · pegá el texto':(m.why||'No pude leerlo · pegá el texto');
  const aiOk=!!ai,ready=usable.length>0;

  return html`<div className="fl" style=${{gap:16}}>
    <div><div className="eyebrow" style=${{marginBottom:8}}>¿Qué vas a subir?</div>
      <div className="chips">${Object.entries(KIND).map(([k,v])=>html`<button key=${k} className="chip" aria-pressed=${kind===k} onClick=${()=>setKind(k)}>${v.e} ${v.n}</button>`)}</div></div>
    <label className=${'drop'+(over?' on':'')} htmlFor=${inId} onDragOver=${e=>{e.preventDefault();setOver(true)}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);addFiles(e.dataTransfer.files)}} style=${{display:'block',cursor:'pointer'}}>
      <${Icon} n="upload" s=${28}/><div style=${{fontWeight:600,marginTop:8}}>Arrastrá tus ${kind==='examen'?'parciales':kind==='resumen'?'resúmenes':'apuntes'} de ${s.name} acá</div><div className="mut" style=${{fontSize:13}}>PDF, Word, PowerPoint, TXT o fotos · se guardan en ${s.emoji} ${s.name}</div></label>
    <input id=${inId} type="file" multiple accept=".pdf,.docx,.pptx,.txt,.md,.csv,.rtf,image/*" style=${{position:'absolute',width:1,height:1,opacity:0}} onChange=${e=>{addFiles(e.target.files);e.target.value=''}}/>
    <input id=${inId+'-cam'} type="file" accept="image/*" capture="environment" style=${{position:'absolute',width:1,height:1,opacity:0}} onChange=${e=>{addFiles(e.target.files);e.target.value=''}}/>
    <input id=${inId+'-gal'} type="file" multiple accept="image/*" style=${{position:'absolute',width:1,height:1,opacity:0}} onChange=${e=>{addFiles(e.target.files);e.target.value=''}}/>
    <div className="row wrap" style=${{justifyContent:'center'}}>
      <label className="btn btn-sm btn-s" htmlFor=${inId} style=${{cursor:'pointer'}}>📁 Archivos o Drive</label>
      <label className="btn btn-sm" htmlFor=${inId+'-cam'} style=${{cursor:'pointer'}}>📷 Sacar foto</label>
      <label className="btn btn-sm" htmlFor=${inId+'-gal'} style=${{cursor:'pointer'}}>🖼️ Galería</label></div>
    <p className="mut" style=${{fontSize:12.5,textAlign:'center',marginTop:-6}}>En el celular, "Archivos" también te deja elegir de Google Drive, iCloud o Descargas. Si es un Google Doc, bajalo primero como PDF o Word.</p>
    <div className="row wrap" style=${{justifyContent:'center'}}><button className="btn btn-sm" onClick=${()=>{setPaste(!paste);setNote(null)}}>${paste?'Cerrar':'✍️ Pegar texto'}</button></div>
    ${paste&&html`<div className="card fl" style=${{gap:10}}>
      <input aria-label="Nombre del material" placeholder="Nombre (ej: Resumen sinapsis)" value=${pn} onInput=${e=>setPn(e.target.value)}/>
      <textarea aria-label="Texto del material" rows="6" placeholder="Pegá acá tus apuntes, tu resumen o las preguntas del parcial" value=${pt} onInput=${e=>setPt(e.target.value)} style=${{width:'100%',font:'inherit',padding:12,borderRadius:16,border:'1.5px solid var(--line)',background:'var(--card)',color:'var(--ink)',resize:'vertical'}}></textarea>
      <div><button className="btn btn-s" onClick=${savePaste}><${Icon} n="check" s=${16}/> Guardar</button></div></div>`}

    ${mats.length===0?html`<p className="mut" style=${{textAlign:'center'}}>Todavía no subiste nada de ${s.name}.</p>`:html`<div className="fl" style=${{gap:8}}><div className="eyebrow">Material de ${s.name} (${mats.length})</div>${mats.map(m=>html`<div key=${m.id} className=${'ccard '+thc(subj)} style=${{padding:'12px 14px'}}>
      <div className="row" style=${{gap:10}}><span style=${{fontSize:22}}>${KIND[m.kind].e}</span>
        <button className="grow" onClick=${()=>setOpen(open===m.id?null:m.id)} aria-expanded=${open===m.id} style=${{border:0,background:'transparent',textAlign:'left',color:'var(--ink)',minWidth:0,padding:0}}>
          <b style=${{fontWeight:600,fontSize:14.5,overflowWrap:'anywhere',display:'block'}}>${m.name}</b>
          <span className="mut" style=${{fontSize:12.5}}>${KIND[m.kind].n} · ${stat(m)}${m.example?' · ejemplo':''}${m.analyzed?' · analizado':''}</span></button>
        <button className="ibtn" style=${{width:32,height:32,flexBasis:32,background:'var(--card)'}} aria-label=${'Quitar '+m.name} onClick=${()=>{BLOBS.delete(m.id);a.delMat(m.id)}}><${Icon} n="x" s=${14}/></button></div>
      ${open===m.id&&html`<div className="fl" style=${{gap:8,marginTop:10}}><div style=${{fontSize:13,whiteSpace:'pre-wrap',maxHeight:220,overflow:'auto',background:'var(--card)',borderRadius:14,padding:12}}>${m.text?m.text.slice(0,2500)+(m.text.length>2500?'…':''):'Todavía no hay texto de este archivo.'}</div>
        ${a.subjects.length>1&&html`<label className="row wrap" style=${{gap:8,fontSize:13}}><span>¿Es de otra materia?</span><select aria-label=${'Mover '+m.name+' a otra materia'} value="" onChange=${e=>{const to=a.subjects.find(x=>x.id===e.target.value);if(!to)return;a.updMat(m.id,{subj:to.id,analyzed:false});setOpen(null);a.toast(m.name+' se movió a '+to.name)}} style=${{width:'auto',minWidth:170,padding:'.35rem .7rem',fontSize:13}}><option value="">Mover a…</option>${a.subjects.filter(x=>x.id!==subj).map(x=>html`<option key=${x.id} value=${x.id}>${x.emoji} ${x.name}</option>`)}</select></label>`}</div>`}</div>`)}</div>`}

    ${imgs.length>0&&html`<div className="alertbox"><b>${imgs.length} archivo${imgs.length>1?'s':''} sin texto (fotos o PDF escaneados).</b> ${aiOk?'La IA puede transcribirlas para usarlas en la guía y las preguntas.':'Necesito la IA para leer fotos. Mientras tanto, pegá el texto.'}
      <div style=${{marginTop:8}}><button className="btn btn-sm btn-s" disabled=${!aiOk||!!job} onClick=${readPhotos}>${job==='photo'?'Leyendo…':'Leer con IA'}</button></div></div>`}

    ${ai===false&&html`<div className="alertbox" style=${{background:'var(--t-cream)'}}>La IA no está disponible en esta vista. Igual podés guardar tu material, buscar en él y analizar tus parciales. Sin IA, las preguntas sobre tu material te muestran las partes que responden y los ejercicios son para completar o de verdadero o falso. La guía necesita la IA.</div>`}

    ${ready&&html`<div className="fl" style=${{gap:10}}>
      <h3 style=${{fontSize:18,fontWeight:700}}>Usá tu material</h3>
      <div className="card fl" style=${{gap:10}}><b>🗂️ Estudiar con tu material: temario y cronograma</b>
        <span className="mut" style=${{fontSize:13}}>Divido tus documentos en temas, estimo cuántos bloques de 45 minutos lleva cada uno y armo tu cronograma de horas de estudio con eso. Durante cada bloque vas a tener a mano la parte de tu material.</span>
        ${matTopics.length>0&&!syl&&html`<div className="alertbox" style=${{background:'var(--t-mint)'}}>Tu cronograma ya usa ${matTopics.length} temas de tu material${s.onlyMat?' (solo esos)':''}.</div>`}
        <div className="row wrap"><button className="btn btn-s btn-sm" disabled=${!!job} onClick=${makeSyl}>${job==='syl'?'Separando en temas…':matTopics.length?'Volver a detectar temas':'Detectar temas'}</button>${matTopics.length>0&&html`<button className="btn btn-sm" onClick=${()=>a.go('calendario')}>Ver cronograma</button>`}</div>
        ${syl&&html`<div className="fl" style=${{gap:8}}>
          ${syl.map((t,i)=>html`<div key=${i} className=${'ccard '+thc(subj)} style=${{padding:'10px 14px'}}><div className="row wrap" style=${{justifyContent:'space-between',gap:8}}><b style=${{fontWeight:600}}>${i+1}. ${t.name}</b><${LevelTag} lv=${t.level}/></div>
            <span className="mut" style=${{fontSize:12.5}}>~${t.blocks} bloque${t.blocks>1?'s':''} de 45 min${t.src?' · '+t.src:''}</span>
            <div className="row" style=${{gap:6,marginTop:6}} role="group" aria-label=${'Importancia de '+t.name}>${['muy','imp','comp'].map(l=>html`<button key=${l} className="chip" style=${{padding:'.25rem .7rem',fontSize:12}} aria-pressed=${t.level===l} onClick=${()=>setSyl(syl.map((x,j)=>j===i?{...x,level:l}:x))}>${LV[l].name}</button>`)}<button className="chip" style=${{padding:'.25rem .7rem',fontSize:12,marginLeft:'auto'}} aria-label=${'Quitar '+t.name} onClick=${()=>setSyl(syl.filter((x,j)=>j!==i))}>Quitar</button></div></div>`)}
          <div className="alertbox" style=${{background:sylNeed>sylHave?'var(--t-rose)':'var(--t-blue)'}}>Necesitás unas <b>${Math.round(sylNeed/60)} h</b> de estudio para estos temas. Hasta el parcial (${d} días, máx. ${a.prefs.maxH} h por día) tenés unas <b>${Math.round(sylHave/60)} h</b>.${sylNeed>sylHave?' No entra todo: priorizo los temas muy importantes y los complementarios quedan para el final.':''}</div>
          <label className="row" style=${{gap:8,fontSize:13.5,cursor:'pointer'}}><input type="checkbox" checked=${only} onChange=${e=>setOnly(e.target.checked)} style=${{width:18,height:18,flex:'0 0 18px',accentColor:'var(--ink)'}}/> Estudiar ${s.name} solo con estos temas</label>
          <div className="row wrap"><button className="btn btn-s btn-sm" disabled=${syl.length===0} onClick=${useSyl}><${Icon} n="calendar" s=${14}/> Usar en mi cronograma</button><button className="btn btn-sm" onClick=${()=>setSyl(null)}>Cancelar</button></div></div>`}
      </div>
      ${usable.length>1&&html`<div><div className="eyebrow" style=${{marginBottom:8}}>Preguntas y ejercicios sobre</div><div className="chips">${[['all','Todo mi material'],...usable.map(m=>[m.id,KIND[m.kind].e+' '+m.name])].map(([k,l])=>html`<button key=${k} className="chip" aria-pressed=${(ids?ids[0]:'all')===k} onClick=${()=>setPick(k)} style=${{maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${l}</button>`)}</div></div>`}
      <${MatChat} key=${(ids?ids[0]:'all')+String(!!ai)} a=${a} s=${s} ai=${ai} setAi=${setAi} usable=${usable} ids=${ids}/>
      <div className="card fl" style=${{gap:8}}><b>📘 Guía de estudio</b><span className="mut" style=${{fontSize:13}}>Un resumen ordenado por prioridad, armado con tus archivos.</span>
        <div className="row wrap"><button className="btn btn-s btn-sm" disabled=${!aiOk||!!job} onClick=${makeGuide}>${job==='guide'?'Armando…':guide?'Armar de nuevo':'Armar guía'}</button>${job==='guide'&&html`<button className="btn btn-sm" onClick=${stop}>Frenar</button>`}</div>
        ${guide&&html`<div style=${{fontSize:14,background:'var(--card)',borderRadius:16,padding:14}}><${Md} text=${guide}/></div>`}</div>
      <div className="card fl" style=${{gap:10}}><b>✏️ Ejercicios personalizados</b><span className="mut" style=${{fontSize:13}}>${aiOk?'Armados con tu material, a tu medida: elegí cuántos, de qué tipo y qué tan difíciles. Si fallás, se programa el repaso.':'Sin IA armo ejercicios para completar y de verdadero o falso con las frases de tu material. Con la IA activada, son a tu medida.'}${mine?' Ya tenés '+mine+' en el banco.':''}</span>
        <div className="fl" style=${{gap:8}}>
          <div className="row wrap" style=${{gap:6}}><span className="mut" style=${{fontSize:12.5,minWidth:70}}>Cantidad</span>${[5,8,12].map(v=>html`<button key=${v} className="chip" aria-pressed=${xc.n===v} onClick=${()=>setXc({...xc,n:v})}>${v}</button>`)}</div>
          <div className="row wrap" style=${{gap:6}}><span className="mut" style=${{fontSize:12.5,minWidth:70}}>Tipo</span>${(aiOk?[['mix','Mezcla'],['mc','Opción múltiple'],['vf','V o F'],['sc','Respuesta corta'],['caso','Casos']]:[['mix','Mezcla'],['sc','Completar'],['vf','V o F']]).map(([k,l])=>html`<button key=${k} className="chip" aria-pressed=${xc.type===k} onClick=${()=>setXc({...xc,type:k})}>${l}</button>`)}</div>
          ${aiOk&&html`<div className="row wrap" style=${{gap:6}}><span className="mut" style=${{fontSize:12.5,minWidth:70}}>Dificultad</span>${[[0,'Progresiva'],[1,'Fácil'],[2,'Media'],[3,'Difícil']].map(([k,l])=>html`<button key=${k} className="chip" aria-pressed=${xc.lvl===k} onClick=${()=>setXc({...xc,lvl:k})}>${l}</button>`)}</div>`}
          ${aiOk&&html`<label className="row" style=${{gap:8,fontSize:13.5,cursor:'pointer'}}><input type="checkbox" checked=${xc.weak} onChange=${e=>setXc({...xc,weak:e.target.checked})} style=${{width:18,height:18,flex:'0 0 18px',accentColor:'var(--ink)'}}/> Reforzar mis temas flojos y lo que fallé</label>`}</div>
        <div className="row wrap"><button className="btn btn-s btn-sm" disabled=${!!job} onClick=${aiOk?makeQs:makeLocalQs}>${job==='qs'?'Armando…':mine?'Generar más':'Generar ejercicios'}</button>
          ${mine>0&&html`<button className="btn btn-sm" onClick=${()=>a.openPractice(subj)}>Practicar (${mine})</button>`}${mine>0&&html`<button className="btn btn-sm" onClick=${()=>a.openSim(subj)}>Simulacro con mi material</button>`}</div></div>
      ${exams.length>0&&html`<div className="card fl" style=${{gap:8}}><b>🧾 Analizar mis parciales</b><span className="mut" style=${{fontSize:13}}>Detecta qué temas toman más y ajusta las prioridades de tu plan.</span>
        <div><button className="btn btn-s btn-sm" disabled=${!!job||newExams.length===0} onClick=${analyze}>${job==='exam'?'Analizando…':newExams.length?'Analizar '+newExams.length+(newExams.length>1?' parciales':' parcial'):'Todo analizado'}</button></div></div>`}
    </div>`}

    ${(job&&job!=='guide'&&job!=='photo')&&html`<div className="mut" style=${{textAlign:'center',fontSize:13}}>Trabajando… puede tardar unos segundos.</div>`}
    ${note&&html`<div className="alertbox" role="status">${note}</div>`}
    ${err&&html`<div className="alertbox" role="alert" style=${{background:'var(--t-rose)'}}>${err}</div>`}

    ${mats.some(m=>m.text)&&html`<div className="fl" style=${{gap:8}}>
      <input aria-label="Buscar en mi material" placeholder="🔎 Buscar en mi material (ej: refractario)" value=${q} onInput=${e=>setQ(e.target.value)}/>
      ${q.trim().length>=3&&hits.length===0&&html`<p className="mut" style=${{fontSize:13}}>No encontré "${q}" en tus archivos.</p>`}
      ${hits.map((h,i)=>html`<div key=${i} className="card" style=${{fontSize:13.5}}><span className="mut" style=${{fontSize:12}}>${KIND[h.m.kind].e} ${h.m.name}</span><div>${h.pre}<mark style=${{background:'var(--t-mint)',color:'var(--ink)',borderRadius:4,padding:'0 2px'}}>${h.hit}</mark>${h.post}</div></div>`)}</div>`}
  </div>`;
}

function MaterialScreen({a}){

const hexOf=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,saltHex){
  try{
    const enc=new TextEncoder(),salt=saltHex||hexOf(crypto.getRandomValues(new Uint8Array(16)));
    const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt.match(/../g).map(h=>parseInt(h,16))),iterations:100000,hash:'SHA-256'},key,256);
    return {ph:hexOf(bits),salt};
  }catch(e){return {ph:'w:'+btoa(unescape(encodeURIComponent(pw))),salt:''}}
}
